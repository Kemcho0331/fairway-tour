<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairway Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
/* Layout: full-bleed course canvas; scoreboard strip pinned top, club rack pinned bottom; clubhouse and scorecard sheets centered over the course */
:root{
  --pine:#0e2f21;
  --pine-2:#17452f;
  --board:#fbfcf6;
  --ink:#16221b;
  --muted:#5b6c61;
  --rule:#d6ded4;
  --hi:#fbf0c6;
  --flag:#f3c437;
  --under:#c62a1f;
  --chalk:#e6efe8;
  --bronze:#d39a62;
  --silver:#c9d0d4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--pine);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

.hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.strip{display:flex;background:var(--board);border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.28),0 8px 20px rgba(0,0,0,.18);overflow:hidden;pointer-events:auto;min-width:0}
.cell{padding:6px 12px 7px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell+.cell{border-left:1px solid var(--rule)}
.lbl{font:600 10px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.val{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:3px}
.val svg{width:18px;height:18px;flex:none;transition:transform .4s}
.sub{font:500 11px/1.2 var(--body);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.under{color:var(--under)}
.tools{display:flex;flex-direction:column;gap:8px;pointer-events:auto;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--board);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.28);cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"]{background:var(--flag)}
button:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

.hud-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.lie{background:rgba(14,47,33,.84);color:#fff;font:600 12px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;padding:7px 12px;border-radius:999px;white-space:nowrap}
.lie.hot{background:var(--under)}
.rack{display:flex;gap:6px;pointer-events:auto;background:rgba(14,47,33,.9);padding:6px;border-radius:10px;max-width:100%}
.club{position:relative;border:0;border-radius:6px;background:transparent;color:var(--chalk);padding:8px 14px 7px;min-width:68px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.club b{font:700 17px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.club small{font:500 10.5px/1 var(--body);opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}
.club.active{background:var(--flag);color:var(--ink)}
.club .auto{position:absolute;top:-8px;right:-3px;font:700 9px/1 var(--body);letter-spacing:.08em;background:var(--board);color:var(--ink);padding:3px 4px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.25)}

.toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:var(--pine);color:#fff;font:700 18px/1.15 var(--display);text-transform:uppercase;letter-spacing:.04em;padding:9px 15px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .25s;max-width:calc(100% - 32px);text-align:center;text-wrap:balance;z-index:5}
.toast.show{opacity:1}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.5);opacity:0;transition:opacity .4s;width:calc(100% - 32px)}
.banner.show{opacity:1}
.banner .bn{font:800 italic 62px/.9 var(--display);text-transform:uppercase;text-wrap:balance}
.banner .bs{font:600 13px/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,22,14,.55);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:460px;max-height:100%;overflow:auto;background:var(--board);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.45);-webkit-user-select:text;user-select:text}
.sheet-head{background:var(--pine-2);color:#fff;padding:18px 20px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.sheet-head::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px);pointer-events:none}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative;z-index:1}
.kicker{font:600 11px/1.2 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--flag)}
.title{font:800 italic 48px/.9 var(--display);text-transform:uppercase;text-wrap:balance}
.title.gold{color:var(--flag)}
.head-sub{font:500 14px/1.3 var(--body);color:var(--chalk)}
.bank{text-align:right;display:flex;flex-direction:column;gap:2px}
.bank b{font:700 28px/1 var(--display);color:var(--flag);font-variant-numeric:tabular-nums}
.bank span{font:600 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk)}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:8px;margin-top:8px;position:relative;z-index:1}
.tab{flex:1;min-width:0;border:0;background:transparent;color:var(--chalk);font:700 14px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;padding:10px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--board);color:var(--ink)}
.sheet-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.facts div{background:var(--board);padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.facts b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.career{font:500 13px/1.45 var(--body);color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.season{border-radius:8px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:6px;background:var(--sc,#3f5fb5);color:#fff;position:relative;overflow:hidden}
.season::after{content:"";position:absolute;right:-24px;bottom:-34px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.season-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.season-name{font:800 italic 34px/.9 var(--display);text-transform:uppercase}
.season-blurb{font:500 13.5px/1.4 var(--body)}
.season-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 12px/1.2 var(--body);flex-wrap:wrap}
.spips{display:flex;gap:5px}
.spips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
.spips i.on{background:#fff}
.sched{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.srow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--rule)}
.srow:first-child{border-top:0}
.srow .n{font:700 15px/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.srow .nm{min-width:0;display:flex;flex-direction:column;gap:2px}
.srow .nm b{font:700 16px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.srow .nm small{font:500 11.5px/1.2 var(--body);color:var(--muted);text-transform:capitalize}
.srow .res{font:700 15px/1 var(--display);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow.next{background:var(--hi)}
.srow.done .nm b{color:var(--muted)}
.chip-s{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:3px;color:#fff;white-space:nowrap}
.lb tr.cutline td{border-top:2px dashed var(--ink)}
.nemtag{font:700 9px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--under);color:#fff;padding:3px 5px;border-radius:3px;vertical-align:2px;white-space:nowrap}
.lb tr.nem td{color:var(--under)}
.nemq{border-left:3px solid var(--under);background:#fbeeea;padding:9px 12px;border-radius:0 6px 6px 0;font:500 13.5px/1.45 var(--body);color:var(--ink)}
.nemq small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.nemcard{border-radius:8px;padding:12px 14px 14px;background:#4a1b16;color:#fff;display:flex;flex-direction:column;gap:6px}
.h2h{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.h2h div{background:rgba(255,255,255,.1);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:3px}
.h2h b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.h2h span{font:600 10px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.facts.facts4{grid-template-columns:repeat(4,1fr)}
.facts.facts4 b{font-size:19px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tro{border:1px solid var(--rule);border-radius:8px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.tro svg{width:40px;height:40px}
.tro b{font:700 12.5px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;max-width:100%}
.tro small{font:500 11px/1.25 var(--body);color:var(--muted)}
.tro.off b{color:var(--muted)}
.unlock{background:var(--pine-2);color:#fff;border-radius:6px;padding:10px 12px;font:700 17px/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em}
.unlock span{color:var(--flag)}
table.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th{font:600 10px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px 6px;border-bottom:1.5px solid var(--ink)}
.lb td{padding:7px 6px;border-bottom:1px solid var(--rule);font:500 15px/1.2 var(--body)}
.lb .r{text-align:right}
.lb td.num{font:700 20px/1 var(--display);text-align:right}
.lb td.pos{font:700 16px/1 var(--display);width:36px}
.lb tr.you td{background:var(--hi);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.btn{font:700 19px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;border:0;border-radius:6px;padding:14px 18px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--flag);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.dark{background:var(--pine-2);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn.sm{font-size:16px;padding:10px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.ev{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.ev.locked{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(22,34,27,.035) 8px 16px)}
.ev.locked .ev-name{color:var(--muted)}
.ev-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ev-name{font:700 23px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.ev-step{font:600 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.trophy{font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--flag);color:var(--ink);padding:4px 6px;border-radius:3px;white-space:nowrap}
.ev-meta{font:500 13px/1.45 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.ev-meta strong{color:var(--ink);font-weight:600}
.ev-lock{font:600 13px/1.3 var(--body);color:var(--muted);display:flex;align-items:center;gap:6px}
.ev-lock svg{width:15px;height:15px;flex:none}
details.how summary{cursor:pointer;font:600 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.howto{margin:8px 0 0;padding-left:18px;color:var(--ink);font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:4px}

.sec{font:600 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 0;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-name{font:700 19px/1 var(--display);text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-desc{font:500 12.5px/1.35 var(--body);color:var(--muted)}
.tier{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:var(--rule);color:var(--ink)}
.tier.t1{background:var(--bronze)}
.tier.t2{background:var(--silver)}
.tier.t3{background:var(--flag)}
.tier.t4{background:var(--ink);color:var(--flag)}
.pips{display:flex;gap:3px}
.pips i{width:16px;height:5px;border-radius:2px;background:var(--rule)}
.pips i.on{background:var(--pine-2)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.swatch{border:1.5px solid var(--rule);background:var(--board);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font:600 12px/1.2 var(--body);color:var(--ink);min-width:0}
.swatch .dot{width:26px;height:26px;border-radius:50%;box-shadow:inset -3px -4px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.3)}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.swatch small{font:500 11px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.swatch:disabled{opacity:.5;cursor:not-allowed}

.golfer-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#gprev{width:150px;height:150px;border-radius:10px;background:radial-gradient(ellipse at 50% 85%,#7cbb5c 0 38%,#5e9c47 39% 60%,#3b7536 61%);flex:none}
.name-field{flex:1 1 180px;display:flex;flex-direction:column;gap:6px;min-width:0}
.name-field input{font:700 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border:1.5px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);width:100%;min-width:0}
.name-field input:focus{outline:3px solid var(--flag);outline-offset:1px;border-color:var(--ink)}
.name-field small{font:500 12px/1.3 var(--body);color:var(--muted)}
.opt{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--board);box-shadow:0 0 0 1.5px var(--rule);cursor:pointer;padding:0}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.tchip{font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:9px 13px;border-radius:999px;border:1.5px solid var(--rule);background:var(--board);color:var(--ink);cursor:pointer}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--board);border-color:var(--ink)}
@media (max-width:440px){
  .tab{font-size:12px;letter-spacing:0}
  .facts.facts4{grid-template-columns:repeat(2,1fr)}
  .cell{padding:5px 8px 6px}
  .val{font-size:21px}
  .lbl{font-size:9px}
  .sub{font-size:10px}
  .rack{width:100%}
  .club{min-width:0;flex:1;padding:8px 4px 7px}
  .title{font-size:40px}
  .banner .bn{font-size:48px}
  .sheet-head,.sheet-body{padding-left:16px;padding-right:16px}
}
.spcard{border:1px solid var(--rule);border-left:4px solid var(--spc);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sp-top{display:flex;gap:10px;align-items:center}
.sp-logo{width:36px;height:36px;border-radius:8px;color:#fff;display:grid;place-items:center;font:800 italic 22px/1 var(--display);flex:none}
.sp-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.sp-id b{font:700 20px/1 var(--display);text-transform:uppercase}
.sp-id small{font:500 12px/1.3 var(--body);color:var(--muted)}
.sp-set{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 13px/1.3 var(--body)}
.sp-set b{font-weight:700}
.rank{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:3px;background:var(--rc);color:var(--ink);white-space:nowrap}
.spbar{display:inline-flex;gap:3px;margin-left:auto}
.spbar i{width:16px;height:6px;border-radius:2px;background:var(--rule)}
.spbar i.on{background:var(--pine-2)}
.goals{display:flex;flex-direction:column;gap:6px}
.goal{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--rule);background:var(--board);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);font:600 14px/1.25 var(--body)}
.goal small{font:500 11.5px/1.2 var(--body);color:var(--muted);white-space:nowrap}
.goal[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);box-shadow:inset 0 0 0 1px var(--ink)}
.goal:disabled{cursor:default;opacity:.55}
.glist{margin:0;padding-left:18px;font:500 13px/1.5 var(--body)}
.glist .gdone{color:var(--muted);text-decoration:line-through}
.gline{border-left:3px solid var(--spc);background:#f1f4ee;padding:8px 12px;border-radius:0 6px 6px 0;font:500 13px/1.4 var(--body)}
.gline b{font-weight:700}
.gline span{font-weight:700;color:var(--muted)}
.gline.ok span{color:#1f6b45}
.gline.bad span{color:var(--under)}
.spline{display:flex;align-items:center;gap:10px;padding:9px 0 9px 10px;border-left:3px solid var(--spc);border-bottom:1px solid var(--rule);font:500 13px/1.3 var(--body)}
.spline b{font:700 16px/1 var(--display);text-transform:uppercase;white-space:nowrap}
.spline span{flex:1;min-width:0}
.spline span{color:var(--muted)}
.bag{display:flex;flex-direction:column;gap:12px}
.slot{display:flex;flex-direction:column;gap:6px}
.slot>b{font:700 17px/1 var(--display);text-transform:uppercase}
.slot small{font:500 12px/1.35 var(--body);color:var(--muted)}
.tchip.sm{font-size:13.5px;padding:8px 11px}
.chip.excl{border-color:var(--flag)}
.gear{padding:10px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:7px}
.gear-top{border-left:3px solid var(--spc);padding-left:9px;display:flex;flex-direction:column;gap:2px}
.gear-top b{font:700 17px/1 var(--display);text-transform:uppercase}
.gear-top small{font:500 12px/1.3 var(--body);color:var(--muted)}
.gear-items{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.gi{display:flex;gap:6px;align-items:center;font:600 12.5px/1.25 var(--body);min-width:0}
.gi.off{color:var(--muted)}
.gi.off .rank{opacity:.5}
.gi .tier{font-size:9px}
@media (max-width:440px){

/* ---------- Courses ---------- */
const WILLOW_HOLES = [
  { name:'The Opener', par:4, yards:351, w:1000, H:2000, seed:101,

    water:[{x:250,y:1150,rx:115,ry:185,rot:0.15,seed:21}] },
  { name:'Ferry Crossing', par:3, yards:174, w:1000, H:1200, seed:202,
    tee:{x:500,y:1090}, cup:{x:490,y:300},
    fairway:[{w:200, pts:[[500,1050],[498,930]]},{w:76, pts:[[400,478],[640,478]]}],
    green:{x:520,y:310,rx:140,ry:104,rot:-0.1,seed:32},
    sand:[{x:712,y:392,rx:62,ry:40,rot:0.5,seed:33},{x:332,y:232,rx:58,ry:38,rot:-0.4,seed:34},{x:600,y:168,rx:72,ry:30,rot:0,seed:35}],
    water:[{x:500,y:665,rx:345,ry:130,rot:0.04,seed:31}] },
  { name:'Long Bend', par:5, yards:469, w:1000, H:2400, seed:303,
    tee:{x:260,y:2290}, cup:{x:700,y:312},
    fairway:[{w:230, pts:[[260,2180],[270,1800],[330,1450],[520,1200],[720,950],[760,650],[700,470]]}],
    green:{x:685,y:330,rx:150,ry:118,rot:-0.2,seed:41},
    sand:[{x:480,y:1420,rx:80,ry:52,rot:0.6,seed:42},{x:870,y:420,rx:52,ry:70,rot:0,seed:43},{x:530,y:300,rx:58,ry:40,rot:-0.3,seed:44}],
    water:[{x:660,y:1640,rx:160,ry:220,rot:0.3,seed:45},{x:420,y:640,rx:110,ry:68,rot:0.2,seed:46}] },
];

const ePt=(e,t)=>{ const c=Math.cos(e.rot||0), s=Math.sin(e.rot||0), x=Math.cos(t)*e.rx, y=Math.sin(t)*e.ry; return [e.x+x*c-y*s, e.y+x*s+y*c]; };
const inE=(e,x,y)=>{ const c=Math.cos(-(e.rot||0)), s=Math.sin(-(e.rot||0)), dx=x-e.x, dy=y-e.y, lx=dx*c-dy*s, ly=dx*s+dy*c; return (lx/e.rx)**2+(ly/e.ry)**2<1; };
const growE=(e,g)=>({x:e.x,y:e.y,rot:e.rot||0,rx:e.rx*1.18+g,ry:e.ry*1.18+g});
// true when two hazard blobs (incl. their wobble) come within `gap` of each other
function ellOverlap(a,b,gap){
  const A=growE(a,gap/2), B=growE(b,gap/2);
  if(inE(B,A.x,A.y)||inE(A,B.x,B.y)) return true;
  for(let k=0;k<72;k++){ const t=k/72*Math.PI*2, p=ePt(A,t), q=ePt(B,t); if(inE(B,p[0],p[1])||inE(A,q[0],q[1])) return true; }
  return false;
}
// green slope: a tilted plane plus one mound or bowl. accel units are world units/s^2, capped below rolling friction
function makeSlope(r, G, diff, o={}){
  const a=r()*Math.PI*2, m=12+diff*28+r()*8, tiered=!!(o.steps&&o.steps.length);
  const peak=(14+diff*26)*(0.6+r()*0.6), sig=0.42*Math.min(G.rx,G.ry), A=(r()<.5?1:-1)*peak*sig/0.607*(tiered?0.45:1);
  const ma=r()*Math.PI*2, md=r()*0.45;
  let tx=Math.cos(a)*m, ty=Math.sin(a)*m;
  if(o.tilt){ const L=Math.hypot(o.tilt[0],o.tilt[1])||1; tx=o.tilt[0]/L*o.tilt[2]; ty=o.tilt[1]/L*o.tilt[2]; }
  if(tiered){ tx*=0.5; ty*=0.5; }
  // a tier is a sigmoid step: peak = steepest pull in world units/s^2 (can beat friction, so balls roll off the step)
  const steps=(o.steps||[]).map(st=>({nx:st.nx, ny:st.ny, c:st.c, w:9, H:st.peak*36, gx:G.x, gy:G.y}));
  return {tx, ty, mx:G.x+Math.cos(ma)*G.rx*md, my:G.y+Math.sin(ma)*G.ry*md, A, sig, cap:72, steps};
}
function slopeAtS(s,x,y){
  if(!s) return {ax:0,ay:0};
  const dx=x-s.mx, dy=y-s.my, s2=s.sig*s.sig, g=Math.exp(-(dx*dx+dy*dy)/(2*s2));
  let ax=-(s.tx - s.A*g*dx/s2), ay=-(s.ty - s.A*g*dy/s2);
  const m=Math.hypot(ax,ay); if(m>s.cap){ ax*=s.cap/m; ay*=s.cap/m; }
  if(s.steps) for(const st of s.steps){ const t=((x-st.gx)*st.nx+(y-st.gy)*st.ny-st.c)/st.w; if(t<-8||t>8) continue; const sg=1/(1+Math.exp(-t)), k=-st.H*sg*(1-sg)/st.w; ax+=k*st.nx; ay+=k*st.ny; }
  return {ax,ay};
}
const Yd=v=>v/YPP;
function genHole(seed, par, diff, name, wet=0, opts={}){
  const r=mulberry32(seed);
  const yds = par===3 ? 145+r()*55 : par===4 ? 340+r()*90 : 475+r()*65;
  const len = yds/YPP;
  const n = par===3 ? 1 : Math.max(3, Math.round(len/360));
  const sl = len/n;
  let x = par===3 ? 380+r()*240 : 320+r()*360, y=0, drift=r()<.5?-1:1;
  const raw=[[x,y]];
  for(let i=0;i<n;i++){
    let dx = par===3 ? (r()*2-1)*sl*0.22 : ((r()*2-1)*0.5*(0.5+diff) + drift*0.18)*sl;
    if(x+dx<240||x+dx>760){ dx=-dx; drift=-drift; }
    dx=clamp(x+dx,240,760)-x;
    const dy=Math.sqrt(Math.max(sl*sl-dx*dx, sl*sl*0.35));
    x+=dx; y-=dy; raw.push([x,y]);
  }
  const top=250, H=Math.round(-y+top+200);
  const P=raw.map(([a,b])=>[a,b-y+top]);
  const tee={x:P[0][0],y:P[0][1]}, cup={x:P[n][0],y:P[n][1]};
  const ang=i=>Math.atan2(P[i+1][1]-P[i][1],P[i+1][0]-P[i][0]);
  const segL=[]; let tot=0; for(let i=0;i<n;i++){ const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]); segL.push(l); tot+=l; }
  const at=d=>{ d=clamp(d,0,tot); for(let i=0;i<n;i++){ if(d<=segL[i]||i===n-1){ const t=Math.min(1,d/segL[i]); return {x:P[i][0]+(P[i+1][0]-P[i][0])*t, y:P[i][1]+(P[i+1][1]-P[i][1])*t, a:ang(i)}; } d-=segL[i]; } return {x:cup.x,y:cup.y,a:ang(n-1)}; };
  const aIn=ang(n-1), fdx=Math.cos(aIn), fdy=Math.sin(aIn);
  const grx=150-diff*40+r()*14, gry=grx*(0.72+r()*0.14);
  const green={x:cup.x+(r()*2-1)*18, y:cup.y+(r()*2-1)*14, rx:grx, ry:gry, rot:(r()*2-1)*0.4, seed:seed+1};
  const fw=270-diff*120, fairway=[];
  if(par===3){
    const a0=ang(0), c0=Math.cos(a0), s0=Math.sin(a0);
    fairway.push({w:190, pts:[[tee.x+c0*40,tee.y+s0*40],[tee.x+c0*150,tee.y+s0*150]]});
    fairway.push({w:95-diff*30, pts:[[cup.x-fdx*(gry+95),cup.y-fdy*(gry+95)],[cup.x-fdx*(gry+15),cup.y-fdy*(gry+15)]]});
  } else {
    const a0=ang(0), fp=P.map(p=>[p[0],p[1]]);
    fp[0]=[tee.x+Math.cos(a0)*120, tee.y+Math.sin(a0)*120];
    fp[n]=[cup.x-fdx*gry*0.6, cup.y-fdy*gry*0.6];
    fairway.push({w:fw, pts:fp});
  }
  const sand=[], water=[]; let sid=10;
  const okSand=b=>!sand.some(o=>ellOverlap(o,b,14));
  const front=Math.atan2(-fdy,-fdx), used=[];
  const gs=2+(diff>0.45?1:0)+(r()<0.4?1:0)+(opts.sand?1:0);
  for(let k=0;k<gs;k++){
    for(let t=0;t<30;t++){
      const a=r()*Math.PI*2;
      if(Math.abs(angDiff(a,front))<0.6 && !(diff>0.6&&k===0)) continue;
      if(used.some(u=>Math.abs(angDiff(a,u))<0.9)) continue;
      const b={x:green.x+Math.cos(a)*(grx+30), y:green.y+Math.sin(a)*(gry+30), rx:45+r()*25, ry:28+r()*12, rot:a+Math.PI/2, seed:seed+(sid++)};
      if(!okSand(b)) continue;
      used.push(a); sand.push(b); break;
    }
  }
  if(par>3){
    const fb=1+(diff>0.5?1:0)+(par===5?1:0)+(opts.sand||0);
    for(let k=0;k<fb;k++){
      for(let t=0;t<8;t++){
        const p=at(tot*(0.28+r()*0.5)), side=r()<.5?-1:1, px=-Math.sin(p.a), py=Math.cos(p.a), off=fw/2+12;
        const b={x:p.x+px*side*off, y:p.y+py*side*off, rx:62+r()*22, ry:38+r()*14, rot:p.a, seed:seed+(sid++)};
        if(okSand(b)){ sand.push(b); break; }
      }
    }
  }
  const gc=Math.cos(-green.rot), gsn=Math.sin(-green.rot);
  const inGreen=(x,y)=>{ const dx=x-green.x, dy=y-green.y, lx=dx*gc-dy*gsn, ly=dx*gsn+dy*gc; return (lx/(grx*1.3))**2+(ly/(gry*1.3))**2<1; };
  const okWater=w=>{
    if(w.x<60||w.x>940) return false;
    const G=growE(w,0);
    for(let k=0;k<48;k++){ const q=ePt(G,k/48*Math.PI*2); if(Math.hypot(q[0]-tee.x,q[1]-tee.y)<150 || inGreen(q[0],q[1])) return false; }
    return !water.some(o=>ellOverlap(o,w,70)) && !sand.some(o=>ellOverlap(o,w,30));
  };
  const tryWater=make=>{ for(let t=0;t<10;t++){ const w=make(); if(okWater(w)){ water.push(w); return; } } };
  if(par===3){

const MAPS = 0.5, VIS = 1.4;

  hole=h;

    h.builtSeason=season().id;
    h.greenPts=blobPts(h.green);
    h.fringePts=blobPts({...h.green, rx:h.green.rx+18, ry:h.green.ry+18});

function buildTypeMap(h){
  const mw=Math.ceil(h.w*MAPS), mh=Math.ceil(h.H*MAPS);

  const g=c.getContext('2d',{willReadFrequently:true});

  const bw=[], nw=[]; h.water.forEach((w,i)=>(w.base?bw:nw).push(h.waterPts[i]));
  const sk=k=>h.sand.map((b,i)=>[b,h.sandPts[i]]).filter(([b])=>(b.kind||'bunker')===k).map(([,q])=>q);
  const fill=ps=>ps.length?g=>ps.forEach(q=>{ closedPath(g,q); g.fill(); }):null;

    [ROUGH, bw.length?g=>{ g.lineCap=g.lineJoin='round'; for(const f of h.fairway){ g.lineWidth=f.w+26; openPath(g,f.pts); g.stroke(); } closedPath(g, blobPts({...h.green, rx:h.green.rx+32, ry:h.green.ry+32})); g.fill(); g.fillRect(h.tee.x-64,h.tee.y-44,128,88); }:null],

let gpos=null;
const swing={phase:'address', t:0, from:0, to:0, cur:G_A0, side:1, putt:false};

function resize(){ dpr=Math.min(2,window.devicePixelRatio||1); const r=cv.getBoundingClientRect(); vw=r.width; vh=r.height; cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr); }

const gauss=()=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
function rivalScore(par, skill, diff, form, persona){
  const P=persona&&PERSONAS[persona];
  let rel=Math.round(0.30-0.62*skill+0.25*diff+season().rival+form+(P?P.mean:0)+(P?P.sd:0.62)*gauss());
  if(rel<=-2){ const e=P?P.eagle:1; if(par===3) rel=Math.random()<0.08*e?-2:-1; else if(par===4) rel=Math.random()<0.15*e?-2:-1; else rel=-2; }
  return par+Math.min(3,rel);
}
function newTournament(){
  HOLES=EV.holes;
  const rt = EV.kind==='q' ? Math.min(3,EV.tier+1) : EV.tier, full=tierRoster(rt), n=nem();
  const ros = EV.kind==='champ' ? tableRows().filter(r=>!r.you).slice(0,5).map(r=>full.find(x=>x[0]===r.n)) : full;
  field=[{name:'You',you:true}, ...ros.map(([name,sk])=>{ const isN=!!(n&&name===n.name), skill=isN?nemSkill(rt):Math.min(0.97,sk+EV.boost), form=gauss()*0.1, per=isN?n.persona:null; return {name, skill, nem:isN, scores:HOLES.map(h=>rivalScore(h.par,skill,EV.diff,form,per))}; })];
  playerScores=[]; duckUsed=false; resetRS();
  HOLES.forEach(h=>setPin(h, h.pins[(Math.random()*h.pins.length)|0]));
  startHole(0);
}
function setWind(mph,a,base){ wind={mph,a,ax:Math.cos(a)*mph*5,ay:Math.sin(a)*mph*5,base:base||wind.base}; }
function rollWind(){ const mph=Math.round(Math.random()*EV.windMax*season().wind), a=Math.random()*Math.PI*2; setWind(mph,a,{mph,a}); }
function gust(){
  const b=wind.base; if(!b) return;
  const mph=Math.round(clamp(b.mph*(0.55+Math.random()*0.9)+(Math.random()*4-2),0,40)), a=b.a+(Math.random()*2-1)*0.35, jump=mph-wind.mph;
  setWind(mph,a);
  if(Math.abs(jump)>=5) toast(jump>0?`Gust! Wind up to ${mph} mph`:`Wind dropped to ${mph} mph`,1500);
}
function startHole(i){
  resetHS(); holeIdx=i; buildHole(HOLES[i]); strokes=0; rollWind(); fx=[]; aim=null;
  ball={x:hole.tee.x,y:hole.tee.y,z:0,vx:0,vy:0,t:0,T:1,h:0,sink:0,holed:false,hidden:false,trail:[],keep:1,windMult:1,capture:CAPTURE_V,pull:6,lipped:false};
  lastPos={x:ball.x,y:ball.y}; gpos={x:ball.x,y:ball.y}; swing.phase='address'; swing.cur=G_A0;
  setOverview(true); snapCamera();
  autoIdx=clubIdx=pickClub(); renderRack(); updateHud();
}
function beginIntro(){
  state='intro'; introT=2.6;
  $('#bnTop').textContent=`${season().name} · ${EV.name} · Hole ${holeIdx+1} of ${HOLES.length}`;
  $('#bnMain').textContent=hole.name;
  $('#bnSub').textContent=`Par ${hole.par} · ${hole.yards} yds · ${hole.pinName} pin`;
  $('#banner').classList.add('show');
}
function endIntro(){ $('#banner').classList.remove('show'); setOverview(false); setReady(); }
function trackLie(){ if(!HS||!RS||strokes===0||!HS.from) return; const lie=terrainAt(ball.x,ball.y);
  if(!HS.pen){ if(HS.club===0) RS.longDrive=Math.max(RS.longDrive, dist(HS.from,ball)*YPP); if(strokes===1 && hole.par>3 && lie===FAIR) RS.fw++; }
  if(lie===GREEN && strokes<=hole.par-2) HS.gir=true;
  if(lie===SAND||lie===POT) HS.sand=true;
  HS.from=null; }
function setReady(){
  trackLie(); state='ready'; ball.lipped=false; gpos={x:ball.x,y:ball.y}; swing.phase='address'; swing.cur=G_A0;
  if(season().gusty && strokes>0) gust();
  autoIdx=clubIdx=pickClub(); renderRack(); updateHud();
  if(holeIdx===0 && strokes===0 && save.stats.events<2) toast('Drag back from anywhere, then let go to swing', 0);
}
function pickClub(){
  const lie=terrainAt(ball.x,ball.y), d=dist(ball,hole.cup), w=eff(2).total, ir=eff(1).total;
  if(lie===GREEN) return 3;
  if(lie===FAIR && d<=75) return 3;
  if(lie===SAND||lie===POT) return d>w*1.2 ? 1 : 2;
  if(d<=w*0.95) return 2;
  if(d<=ir*0.95) return 1;
  return 0;
}
function lieFactor(e, lie){ if(lie===SAND) return e.putt?0.55:e.sand; if(lie===POT) return e.putt?0.4:e.sand*0.62; let f=(lie===ROUGH && !e.putt && (season().roughLie||isDesert(hole))) ? Math.min(season().roughLie||1, isDesert(hole)?0.7:1) : (TER[lie]?TER[lie].lie:1); if(lie===ROUGH && e.rough) f=Math.max(f,e.rough); return f; }

function shoot(dx,dy,p){
  const e=eff(clubIdx), lie=terrainAt(ball.x,ball.y), pc=Math.min(p,1);
  if(HS){ HS.from={x:ball.x,y:ball.y}; HS.club=clubIdx; HS.lie=lie; HS.pen=false; if(lie===GREEN) HS.putts++; }
  lastPos={x:ball.x,y:ball.y}; strokes++;
  const spread=(TER[lie]?TER[lie].spread:1)*e.spread*(e.putt?0.25:1)*(0.6+pc*0.6);
  const ang=Math.atan2(dy,dx)+(Math.random()*2-1)*spread*Math.PI/180;
  const ux=Math.cos(ang), uy=Math.sin(ang), lf=lieFactor(e,lie), pt=eff(3);
  swing.phase='down'; swing.t=0; swing.from=swing.cur; swing.to=G_A0-(e.putt?0.9:2.5);
  ball.trail=[]; ball.lipped=false; ball.capture=pt.capture*(e.putt?1:0.7); ball.pull=pt.pull; ball.windMult=e.wind; ball.keep=e.keep||1; ball.cax=0; ball.cay=0; ball.curveMsg=null; ball.brk=e.putt?(e.brk||1):1;
  if(e.putt){
    const v=e.v*p*lf*(1+clamp(gauss(),-2.5,2.5)*e.speedErr); ball.vx=ux*v; ball.vy=uy*v; ball.z=0; state='rolling'; Sound.putt(p);
  } else {
    const carry=p*e.carry*lf, T=e.T*(0.45+0.55*pc), v=carry/T;
    ball.vx=ux*v; ball.vy=uy*v; ball.t=0; ball.T=T; ball.h=e.h*(0.5+0.5*pc); state='flying';
    if(p>1){
      const over=(p-1)/0.1;
      if(Math.random()<0.35+0.65*over){
        // side 1 = hook (curves left of the target line), -1 = slice
        const D=carry*(0.05+0.15*over)*(0.45+0.55*Math.random())*e.hook, side=Math.random()<0.5?1:-1, k=2*D/(T*T);
        ball.cax=uy*k*side; ball.cay=-ux*k*side;
        ball.curveMsg = side===1 ? (D>carry*0.1?'Overswing! Big hook':'Overswing. Hooked it') : (D>carry*0.1?'Overswing! Big slice':'Overswing. Sliced it');
      }
    }
    Sound.swing(pc); Sound.hit(); if(isSand(lie)){ Sound.land(SAND); fx.push({type:'puff',x:ball.x,y:ball.y,t:0}); }
  }
  updateHud();
}

function hitTree(inAir){
  for(const t of hole.trees){
    const dx=ball.x-t.x, dy=ball.y-t.y, d=Math.hypot(dx,dy), rr=t.r*0.9+BALL_R;
    if(d<rr && d>0.001){
      const nx=dx/d, ny=dy/d; ball.x=t.x+nx*(rr+0.5); ball.y=t.y+ny*(rr+0.5);
      const vn=ball.vx*nx+ball.vy*ny; if(vn<0){ ball.vx-=2*vn*nx; ball.vy-=2*vn*ny; }
      const k=inAir?0.3:0.5; ball.vx*=k; ball.vy*=k; Sound.thunk(); return true;
    }
  }
  return false;
}
function stepFlight(dt){
  const n=Math.max(1,Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/5)), h=dt/n;
  for(let i=0;i<n;i++){
    ball.t+=h; ball.vx+=(wind.ax*ball.windMult+ball.cax)*h; ball.vy+=(wind.ay*ball.windMult+ball.cay)*h; ball.x+=ball.vx*h; ball.y+=ball.vy*h;
    const u=Math.min(1,ball.t/ball.T); ball.z=4*ball.h*u*(1-u);
    if(ball.z<18 && hitTree(true)) ball.t=ball.T;
    if(ball.t>=ball.T){ land(); return; }
  }
  ball.trail.push({x:ball.x,y:ball.y-ball.z}); if(ball.trail.length>28) ball.trail.shift();
}
function land(){
  ball.z=0; const t=terrainAt(ball.x,ball.y);
  if(ball.curveMsg){ toast(ball.curveMsg,1500); ball.curveMsg=null; }
  if(t===OOB) return penalty('oob');
  if(t===WATER) return penalty('water');
  if(dist(ball,hole.cup)<CUP_R-3.5) return holeOut();
  const k=Math.min(1,ball.keep)*TER[t].keep; ball.vx*=k; ball.vy*=k;
  Sound.land(t); if(isSand(t)) fx.push({type:'puff',x:ball.x,y:ball.y,t:0});
  state='rolling';
}
function stepRoll(dt){
  let s=Math.hypot(ball.vx,ball.vy);
  const n=Math.max(1,Math.ceil(s*dt/3)), h=dt/n;
  for(let i=0;i<n;i++){
    const t=terrainAt(ball.x,ball.y);
    if(t===OOB) return penalty('oob');
    if(t===WATER) return penalty('water');
    if(t===GREEN && hole.slope){ const sv=slopeAtS(hole.slope,ball.x,ball.y), bk=ball.brk||1; ball.vx+=sv.ax*h*bk; ball.vy+=sv.ay*h*bk; }
    s=Math.hypot(ball.vx,ball.vy);
    const dx=hole.cup.x-ball.x, dy=hole.cup.y-ball.y, d=Math.hypot(dx,dy);
    if(d<CUP_R){
      const b=s>1?Math.abs(ball.vx*dy-ball.vy*dx)/s:0, cap=ball.capture*Math.max(0,1-(b/CUP_R)**2);
      if(s<cap || s<12) return holeOut();
      if(!ball.lipped){ ball.lipped=true;
        const A=0.2+0.5*b/CUP_R, rot=a=>[ball.vx*Math.cos(a)-ball.vy*Math.sin(a), ball.vx*Math.sin(a)+ball.vy*Math.cos(a)];
        const v1=rot(A), v2=rot(-A), v=(v1[0]*dx+v1[1]*dy)<(v2[0]*dx+v2[1]*dy)?v1:v2;
        ball.vx=v[0]*0.75; ball.vy=v[1]*0.75; Sound.lip(); }
    } else if(d>CUP_R+3) ball.lipped=false;
    if(d<CUP_R+2 && d>0.5 && s<45){ const pull=120*h; ball.vx+=dx/d*pull; ball.vy+=dy/d*pull; }
    s=Math.hypot(ball.vx,ball.vy);
    const ns=Math.max(0,s-(fricOf(t)+0.3*s)*h), f=s>0?ns/s:0;
    ball.vx*=f; ball.vy*=f; ball.x+=ball.vx*h; ball.y+=ball.vy*h;
    hitTree(false);
    if(ns<=0) break;
  }
  if(Math.hypot(ball.vx,ball.vy)<4){ ball.vx=ball.vy=0; stopped(); }
}
function stopped(){
  if(strokes>=MAX_STROKES){ state='holed'; holedT=1.6; toast(`Picked up at ${MAX_STROKES} strokes`); return; }
  setReady();
}
function penalty(kind){
  state='penalty'; penT=1.5; ball.vx=ball.vy=0; ball.z=0; ball.hidden=true; ball.trail=[];
  ball.dropTo=(kind==='water' && hole.drop) ? {x:hole.drop.x, y:hole.drop.y} : null;
  if(kind==='water'){
    Sound.splash(); fx.push({type:'splash',x:ball.x,y:ball.y,t:0});
    if(save.ball==='duck' && !duckUsed){ duckUsed=true; toast('Lucky Duck! No penalty this time'); }
    else { strokes++; if(RS){ RS.pens++; HS.pen=true; } toast(ball.dropTo?'Splash! +1. Play from the drop zone':'Splash! +1 penalty stroke'); }
  } else { strokes++; if(RS){ RS.pens++; HS.pen=true; } Sound.thunk(); toast('Out of bounds. +1 penalty stroke'); }
  updateHud();
}
function holeOut(){
  if(HS&&RS&&HS.from){ if(HS.lie===GREEN) RS.longPutt=Math.max(RS.longPutt, dist(HS.from,hole.cup)*YPP*3); else RS.chipin++; if(strokes<=hole.par-1) HS.gir=true; HS.from=null; }
  state='holed'; holedT=1.5; ball.holed=true; ball.x=hole.cup.x; ball.y=hole.cup.y; ball.vx=ball.vy=0; ball.z=0;
  Sound.cup();
  const rel=strokes-hole.par;
  if(strokes===1) Sound.cheer(1.2); else if(rel<=-2) Sound.cheer(1); else if(rel===-1) Sound.cheer(0.6);
  toast(scoreName(strokes,hole.par));
  updateHud();
}
function scoreName(score,par){
  if(score===1) return 'Hole in one!';
  const r=score-par, names={'-3':'Albatross','-2':'Eagle','-1':'Birdie','0':'Par','1':'Bogey','2':'Double bogey','3':'Triple bogey'};
  return names[r] || (r>0?`+${r}`:`${r}`);
}
function completeHole(){
  state='done'; hideToast();
  const score=Math.min(strokes,MAX_STROKES), i=holeIdx, rel=score-HOLES[i].par;
  playerScores.push(score);
  if(rel<=-1) save.stats.birdies++;
  if(RS){ if(HS.gir) RS.gir++; if(HS.putts>=3) RS.three++; if(rel<=-1){ RS.birdies++; RS.run++; RS.streak=Math.max(RS.streak,RS.run); } else RS.run=0; if(rel<=-2) RS.eagles++; if(rel>=1) RS.bogeys++; if(HS.sand&&rel<=0) RS.sandSave++; }
  if(score===1) save.stats.hio++;

}

/* ---------- Standings ---------- */
const fmtPar = n => n===0 ? 'E' : n>0 ? `+${n}` : `−${Math.abs(n)}`;
const money = n => '$'+n.toLocaleString('en-US');
const ordinal = n => n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
function standings(){
  const done=playerScores.length;
  return field.map(p=>{ const sc=p.you?playerScores:p.scores.slice(0,done); const tot=sc.reduce((a,s,i)=>a+s-HOLES[i].par,0); return {name:p.you?playerName():p.name,you:!!p.you,nem:!!p.nem,tot,thru:sc.length,strokes:sc.reduce((a,b)=>a+b,0)}; })
    .sort((a,b)=>a.tot-b.tot || (b.you?1:0)-(a.you?1:0));
}
function posOf(st,s){ const pos=1+st.filter(o=>o.tot<s.tot).length; const tied=st.filter(o=>o.tot===s.tot).length>1; return {pos,tied,label:(tied?'T':'')+pos}; }
function boardHTML(){
  const st=standings();
  return `<table class="lb"><thead><tr><th>Pos</th><th>Player</th><th class="r">Thru</th><th class="r">To par</th></tr></thead><tbody>${
    st.map(s=>`<tr class="${s.you?'you':''} ${s.nem?'nem':''}"><td class="pos">${posOf(st,s).label}</td><td>${esc(s.name)}${s.nem?' <span class="nemtag">Nemesis</span>':''}</td><td class="r">${s.thru===HOLES.length?'F':s.thru}</td><td class="num ${s.tot<0?'under':''}">${fmtPar(s.tot)}</td></tr>`).join('')
  }</tbody></table>`;
}

  $('#hPar').textContent=`Par ${hole.par}`;
  $('#hYds').textContent=`${hole.yards} yds`;
  $('#hStrokes').textContent=strokes;
  { const pd=dist(ball,hole.cup)*YPP; $('#hPin').textContent = (terrainAt(ball.x,ball.y)===GREEN || pd<20) ? `Pin ${Math.round(pd*3)} ft` : `Pin ${Math.round(pd)} yds`; }
  const st=standings(), me=st.find(s=>s.you);
  const tot=$('#hTotal'); tot.textContent=fmtPar(me.tot); tot.classList.toggle('under',me.tot<0);
  $('#hPos').textContent=playerScores.length? `Pos ${posOf(st,me).label}` : 'Round 1';

}
function renderRack(){

function careerCard(){
  const c=career(), T=tierDef(), S=season(), rows=tableRows(), me=rows.find(r=>r.you), rank=rows.indexOf(me)+1;
  const dots=Array.from({length:8},(_,k)=>`<i class="${c.played[k]?'on':''}"></i>`).join('')+`<i class="${c.played.champ?'on':''}" style="border-radius:2px"></i>`;
  const goal=c.tier<3?'Top 2 move up · Top 6 make the Championship':'Finish 1st to be Player of the Year';
  return `<div class="season" style="--sc:${S.color}">
    <div class="season-top"><span>${T.name} · Year ${c.year}</span><span>${ordinal(rank)} · ${me.pts} pts</span></div>
    <span class="season-name">${S.name}</span>
    <span class="season-blurb">${S.blurb}</span>
    <div class="season-foot"><span class="spips" aria-label="Schedule progress">${dots}</span><span>${goal}</span></div>
  </div>`;
}
function eventMeta(e){
  const owed=e.fee>save.cash && e.fee>0;
  return `${e.tagline?`<strong>${e.tagline}</strong><br>`:''}${e.pars.length} holes · par ${e.par} · field of ${e.kind==='champ'?6:tierRoster(e.kind==='q'?Math.min(3,e.tier+1):e.tier).length+1} · wind up to ${e.windMax} mph<br>
    Winner <strong>${money(e.payouts[0])}</strong> · Entry <strong>${e.fee?money(e.fee):'Free'}</strong>${owed?' (on credit, taken from winnings)':''}${e.kind==='q'?'':` · ${e.mult>1?'<strong>Double points</strong>':'Standings points'}`}`;
}

      <li>Arrows on the green point downhill. Putts break that way.</li>

      <li>The top 6 play the Tour Championship. The top 2 after it move up a tier. Miss out and you can try Q-School, where only a win gets you through.</li>

function shopExclHTML(){

function buyUpgrade(id){ const t=save.gear[id]||0, price=UPGRADES[id].prices[t]; if(t>=4||save.cash<price) return; save.cash-=price; save.gear[id]=t+1; persist(); Sound.coin(); toast(`${TIERS[t+1]} ${CLUBS.find(c=>c.id===id).name} in the bag`); showHub(true); }
function buyBall(id){ const b=BALLS.find(x=>x.id===id); if(!save.ballsOwned.includes(id)){ if(save.cash<b.price) return; save.cash-=b.price; save.ballsOwned.push(id); Sound.coin(); toast(`Bought ${b.name}`); } else Sound.tick(); save.ball=id; persist(); showHub(true); }
function buyColor(id){ const c=COLORS.find(x=>x.id===id); if(!save.colorsOwned.includes(id)){ if(save.cash<c.price) return; save.cash-=c.price; save.colorsOwned.push(id); Sound.coin(); } else Sound.tick(); save.color=id; persist(); showHub(true); }

function playCurrent(){

function newYear(){ const c=career(); c.year++; c.k=0; c.phase='season'; c.pts={}; c.wins={}; c.played={}; }
function sumRel(scores, pars){ return scores.reduce((a,s,i)=>a+s-pars[i],0); }
// season finish: promotion, Q-School or Player of the Year
function yearEnd(){
  const c=career(), rank=myRank(), T=tierDef();
  if(c.tier<3 && rank<=2){
    const to=TOUR[c.tier+1].name; addTrophy('promo:'+(c.tier+1), `${to} card`, 'promo'); c.tier++; newYear(); save.stats.promotions=(save.stats.promotions||0)+1;
    return `<div class="season" style="--sc:#1f6b45"><div class="season-top"><span>Promotion</span><span>Finished ${ordinal(rank)}</span></div><span class="season-name">Welcome to the ${to}</span><span class="season-blurb">Bigger purses, tougher courses, and a stronger field start now.</span></div>`;
  }
  if(c.tier===3){
    const poy=rank===1; if(poy){ save.stats.poy=(save.stats.poy||0)+1; addTrophy('poy','Player of the Year','poy'); } newYear();
    return `<div class="season" style="--sc:${poy?'#8a6a12':'#3f6c8a'}"><div class="season-top"><span>Season over</span><span>Finished ${ordinal(rank)}</span></div><span class="season-name">${poy?'Player of the Year':'Year '+(career().year)+' awaits'}</span><span class="season-blurb">${poy?'You topped the Pro Tour. That is the summit of Texas golf.':'A new Pro Tour season starts in spring.'}</span></div>`;

}
function finishEvent(wd){
  const c=career(), kind=EV.kind, pars=HOLES.map(h=>h.par), prevSeason=season().id;
  const keys=field.map(p=>p.you?ME:p.name);
  const totals=field.map(p=>p.you ? (wd?999:sumRel(playerScores,pars)) : sumRel(p.scores,pars));
  const best=Math.min(...totals), outright=totals.filter(t=>t===best).length===1;
  const order=totals.map((t,i)=>i).sort((a,b)=>totals[a]-totals[b]);
  const myPos=wd?null:1+totals.filter(t=>t<totals[0]).length, tied=!wd && totals.filter(t=>t===totals[0]).length>1;
  const label=wd?'WD':(tied?'T':'')+myPos;
  let pts=totals.map(()=>0);
  if(kind!=='q'){ pts=awardPoints(totals, EV.mult); if(wd) pts[0]=0; keys.forEach((k,i)=>{ c.pts[k]=(c.pts[k]||0)+pts[i]; }); if(outright){ const w=keys[order[0]]; c.wins[w]=(c.wins[w]||0)+1; } }
  const champ=!wd && myPos===1 && !tied, tierAt=c.tier;
  const prize=wd?0:(EV.payouts[myPos-1]||0), owed=EV._owed||0, net=Math.max(0, prize-owed);
  save.cash+=net;
  const s=save.stats, r=rec(EV.id);
  if(!wd){ s.events++; s.earnings+=net; if(champ) s.wins++; if(s.best===null || totals[0]<s.best) s.best=totals[0];
    r.played++; if(champ) r.wins++; if(r.bestFinish===null || myPos<r.bestFinish) r.bestFinish=myPos; if(r.bestScore===null || totals[0]<r.bestScore) r.bestScore=totals[0]; }
  const myPts=Math.round(pts[0]);
  if(!wd){ if(myPos<=5) s.top5=(s.top5||0)+1;
    const implied=(0.30+0.25*EV.diff+season().rival-totals[0]/pars.length)/0.62; save.form=(save.form||[]).concat([clamp(implied,0,1)]).slice(-6); }
  if(champ && EV.major){ s.majors=(s.majors||0)+1; addTrophy('major:'+EV.id, EV.name, 'major'); }
  if(champ && kind==='champ') addTrophy('champ:'+tierAt, EV.name, 'champ');
  let nemNote=nemesisAfterEvent(keys, totals, wd);
  const spNote=sponsorsAfterEvent({wd, pos:myPos, champ}); EV._goals=null;
  let note='';
  if(kind==='season'){
    c.played[c.k]={label, pts:myPts};
    c.k++;
    if(c.k>=8){ c.phase='champ'; const rk=myRank();
      note=rk<=6?`<div class="unlock">You made the <span>Tour Championship</span> as the ${ordinal(rk)} seed</div>`:`<div class="career">You finished the regular season ${ordinal(rk)}. Only the top 6 play the Tour Championship.</div>`; }
  } else if(kind==='champ'){
    c.played.champ={label, pts:myPts}; note=yearEnd();
  } else {
    if(champ){ addTrophy('qschool','Q-School','q'); const to=TOUR[c.tier+1].name; addTrophy('promo:'+(c.tier+1), `${to} card`, 'promo'); c.tier++; newYear(); save.stats.promotions=(save.stats.promotions||0)+1;
      note=`<div class="season" style="--sc:#1f6b45"><div class="season-top"><span>Q-School</span><span>Won it</span></div><span class="season-name">Welcome to the ${to}</span><span class="season-blurb">You earned your card the hard way.</span></div>`; }
    else { newYear(); note=`<div class="career">Only a win gets through Q-School. Year ${c.year} starts back on the ${tierDef().name}.</div>`; }
  }
  if(season().id!==prevSeason && kind==='season' && c.phase==='season'){ Sound.setSeason(season().id); note+=`<div class="season" style="--sc:${season().color}"><div class="season-top"><span>Season change</span><span>${tierDef().name}</span></div><span class="season-name">${season().name} is here</span><span class="season-blurb">${season().blurb}</span></div>`; }
  else if(season().id!==prevSeason) Sound.setSeason(season().id);
  persist();
  const rows=tableRows(), rk=rows.findIndex(x=>x.you)+1;
  openSheet('results',`
    <div class="sheet-head">
      <span class="kicker">${EV.name} · final</span>
      <span class="title ${champ?'gold':''}">${wd?'Withdrew':champ?'Champion':`Finished ${label}`}</span>
      <span class="head-sub">${wd?'No points or prize money':`${playerScores.reduce((a,b)=>a+b,0)} strokes · ${fmtPar(totals[0])}${tied&&myPos===1?' · a tie does not count as a win':''}`}</span>
    </div>
    <div class="sheet-body">
      ${note}${nemNote}${spNote}
      <div class="facts">
        <div><span class="lbl">Prize</span><b>${money(net)}</b></div>
        <div><span class="lbl">${kind==='q'?'Bank':'Points'}</span><b>${kind==='q'?money(save.cash):'+'+myPts}</b></div>
        <div><span class="lbl">${kind==='q'?'Result':'Standing'}</span><b>${kind==='q'?(champ?'Won':label):ordinal(rk)}</b></div>
      </div>
      ${owed&&!wd?`<div class="career">Entry fee of ${money(owed)} came out of your winnings.</div>`:''}
      ${wd?'':boardHTML()}
      <div class="row"><button class="btn primary" id="hubBtn" type="button">Clubhouse</button></div>
    </div>`, '#hubBtn');
  if(champ) Sound.cheer(1.2);
  $('#hubBtn').onclick=()=>{ hubTab='tour'; showHub(); };
}

function simulateChamp(){
  const c=career(), T=tierDef(), e=T.champEv, top=tableRows().filter(r=>!r.you).slice(0,6);
  const full=tierRoster(c.tier), nn=nem(); const res=top.map(r=>{ const isN=!!(nn&&r.n===nn.name), sk=isN?nemSkill(c.tier):Math.min(.97,full.find(x=>x[0]===r.n)[1]+e.boost), f=gauss()*.1; return {n:r.n, tot:e.pars.reduce((a,p)=>a+rivalScore(p,sk,e.diff,f,isN?nn.persona:null)-p,0)}; });
  const pts=awardPoints(res.map(x=>x.tot), e.mult); res.forEach((x,i)=>{ c.pts[x.n]=(c.pts[x.n]||0)+pts[i]; });
  const best=Math.min(...res.map(x=>x.tot)); if(res.filter(x=>x.tot===best).length===1){ const w=res.find(x=>x.tot===best).n; c.wins[w]=(c.wins[w]||0)+1; }
  c.played.champ={label:'DNQ', pts:0};
  const note=yearEnd(); persist(); Sound.setSeason(season().id);
  res.sort((a,b)=>a.tot-b.tot);
  openSheet('results',`
    <div class="sheet-head"><span class="kicker">${e.name} · final</span><span class="title">${esc(res[0].n)} wins</span><span class="head-sub">You did not qualify this year</span></div>
    <div class="sheet-body">${note}
      <table class="lb"><thead><tr><th>Pos</th><th>Player</th><th class="r">To par</th></tr></thead><tbody>${res.map((x,i)=>`<tr><td class="pos">${i+1}</td><td>${esc(x.n)}</td><td class="num ${x.tot<0?'under':''}">${fmtPar(x.tot)}</td></tr>`).join('')}</tbody></table>
      <div class="row"><button class="btn primary" id="hubBtn" type="button">Clubhouse</button></div></div>`, '#hubBtn');
  $('#hubBtn').onclick=()=>{ hubTab='tour'; showHub(); };
}
function showBoard(){
  if(sheetKind || state==='menu') return;
  openSheet('board',`
    <div class="sheet-head"><span class="kicker">Leaderboard · after ${playerScores.length} of ${HOLES.length}</span><span class="title">${EV.name}</span></div>
    <div class="sheet-body">${goalHoleHTML()}${boardHTML()}
      <div class="row"><button class="btn primary" id="backBtn" type="button">Back to the course</button><button class="btn ghost" id="wdBtn" type="button">Withdraw</button></div>
    </div>`, '#backBtn');
  $('#backBtn').onclick=closeSheet;
  let armed=false;
  $('#wdBtn').onclick=e=>{ if(!armed){ armed=true; e.currentTarget.textContent=EV.kind==='q'?'Tap again · give up Q-School':'Tap again · 0 points, fee lost'; return; } aim=null; hideToast(); $('#banner').classList.remove('show'); finishEvent(true); };
}

/* ---------- Input ---------- */
function maxDrag(){ return clamp(Math.min(vw,vh)*0.34,110,230); }
function aimInfo(){
  if(!aim) return null;
  const dx=aim.x-aim.sx, dy=aim.y-aim.sy, L=Math.hypot(dx,dy); if(L<10) return null;
  const md=maxDrag(), putt=!!CLUBS[clubIdx].putt, om=md*1.3, Lc=Math.min(L, putt?md:om);
  const p = Lc<=md ? Lc/md : 1+0.1*(Lc-md)/(om-md);
  return {dx:-dx/L, dy:-dy/L, p, L:Lc, md};
}
cv.addEventListener('pointerdown',e=>{
  if(!overlay.hidden) return;
  if(state==='intro'){ endIntro(); return; }
  if(state!=='ready') return;
  if(overview){ setOverview(false); return; }
  aim={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  hideToast();
});
cv.addEventListener('pointermove',e=>{ if(aim && e.pointerId===aim.id){ aim.x=e.clientX; aim.y=e.clientY; } });
cv.addEventListener('pointerup',e=>{ if(!aim || e.pointerId!==aim.id) return; const a=aimInfo(); aim=null; if(a && a.p>0.04 && state==='ready') shoot(a.dx,a.dy,a.p); });
cv.addEventListener('pointercancel',()=>{ aim=null; });
$('#viewBtn').onclick=()=>{ if(state==='ready'){ setOverview(!overview); } else if(state==='intro') endIntro(); };
$('#boardBtn').onclick=showBoard;
$('#soundBtn').onclick=toggleSound;
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(aim) aim=null; else if(sheetKind==='board') closeSheet(); return; }
  if(!overlay.hidden) return;
  if(e.key>='1'&&e.key<='4') selectClub(+e.key-1);
  else if(e.key==='v'||e.key==='V'){ if(state==='ready') setOverview(!overview); }
  else if(e.key==='l'||e.key==='L') showBoard();
  else if(e.key==='m'||e.key==='M') toggleSound();
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) Sound.suspend(); else Sound.resume(); });

/* ---------- Camera ---------- */
function baseZoom(){ return clamp(Math.min(vw/720, vh/860), 0.32, 1.25); }
function overviewZoom(){ return Math.max(0.05, Math.min(vw/(hole.w+60), (vh-150)/(hole.H+60))); }
function fitTwo(a,b){
  const z=Math.max(overviewZoom(), Math.min(baseZoom(), (vw-90)/(Math.abs(a.x-b.x)+80), (vh-230)/(Math.abs(a.y-b.y)+80)));
  return {x:(a.x+b.x)/2, y:(a.y+b.y)/2-10/z, z};
}
function fitPts(pts){
  const xs=pts.map(q=>q.x), ys=pts.map(q=>q.y), x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const z=Math.max(overviewZoom(), Math.min(baseZoom(), (vw-90)/(x1-x0+80), (vh-230)/(y1-y0+80)));
  return {x:(x0+x1)/2, y:(y0+y1)/2-10/z, z};
}
function shotEnd(ux,uy,p){
  const e=eff(clubIdx), lie=terrainAt(ball.x,ball.y), lf=lieFactor(e,lie);
  if(e.putt){ const r=rollDist(e.v*p*lf, fricOf(lie)); return {x:ball.x+ux*r, y:ball.y+uy*r}; }
  const carry=p*e.carry*lf, T=e.T*(0.45+0.55*p), roll=rollDist(carry/T*Math.min(1,e.keep), fricOf(FAIR)), wm=e.wind;
  return {x:ball.x+ux*(carry+roll)+0.5*wind.ax*wm*T*T, y:ball.y+uy*(carry+roll)+0.5*wind.ay*wm*T*T};
}
function camTarget(){
  if(overview) return {x:hole.w/2, y:hole.H/2+20, z:overviewZoom()};
  if(state==='ready'){
    const a=aimInfo();
    if(a){ const end=shotEnd(a.dx,a.dy,Math.max(1,a.p)), tl=(a.md*1.3*BAND+40)/cam.z;
      return fitPts([ball, end, {x:ball.x-a.dx*tl, y:ball.y-a.dy*tl}]); }
    const dx=hole.cup.x-ball.x, dy=hole.cup.y-ball.y, d=Math.hypot(dx,dy)||1;
    const reach=Math.min(d, eff(clubIdx).total*1.05);
    return fitTwo(ball, {x:ball.x+dx/d*reach, y:ball.y+dy/d*reach});
  }
  return {x:ball.x, y:ball.y, z:baseZoom()};
}
function clampCam(){
  if(aim && state==='ready') return; // let the camera leave the hole so the pull-back stays on screen
  const hw=vw/2/cam.z, hh=vh/2/cam.z, m=50;
  cam.x = hole.w+2*m > 2*hw ? clamp(cam.x, hw-m, hole.w-hw+m) : hole.w/2;
  cam.y = hole.H+2*m > 2*hh ? clamp(cam.y, hh-m-60, hole.H-hh+m+40) : hole.H/2;
}
function snapCamera(){ const t=camTarget(); cam.x=t.x; cam.y=t.y; cam.z=t.z; clampCam(); }
function updateCamera(dt){ const t=camTarget(), k=1-Math.exp(-dt*(overview?3:4.5)); cam.z+=(t.z-cam.z)*k; cam.x+=(t.x-cam.x)*k; cam.y+=(t.y-cam.y)*k; clampCam(); }

/* ---------- Loop ---------- */
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
let wx=[], wxSeason=null;
function resetWeather(){
  const w=season().weather; wxSeason=season().id;
  const n = RM ? 0 : w==='rain'?150 : w==='snow'?110 : w==='leaves'?26 : 0;
  wx=Array.from({length:n},()=>({x:Math.random()*Math.max(vw,1), y:Math.random()*Math.max(vh,1), s:Math.random(), r:Math.random()*6.28, c:(Math.random()*4)|0}));
}
function stepWeather(dt){
  if(wxSeason!==season().id) resetWeather();
  const w=season().weather, wxs=wind.mph*Math.cos(wind.a)*3, wys=wind.mph*Math.sin(wind.a)*1.5;
  for(const p of wx){
    if(w==='rain'){ p.x+=(wxs*1.4-30)*dt; p.y+=(560+p.s*220)*dt; }
    else if(w==='snow'){ p.x+=(wxs+Math.sin(time*1.2+p.r)*16)*dt; p.y+=(34+p.s*38+wys*0.3)*dt; }
    else { p.x+=(wxs*2+Math.sin(time*1.8+p.r)*30)*dt; p.y+=(26+p.s*28+wys)*dt; p.r+=dt*(1.5+p.s*3); }
    if(p.y>vh+20){ p.y=-20; p.x=Math.random()*vw; } if(p.y<-30) p.y=vh+10;
    if(p.x>vw+20) p.x=-20; else if(p.x<-20) p.x=vw+20;
  }
}
function drawWeather(){
  const w=season().weather;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = w==='rain'?'rgba(40,60,90,.07)' : w==='sun'?'rgba(255,214,120,.05)' : w==='snow'?'rgba(210,230,250,.06)' : 'rgba(200,120,40,.04)';
  ctx.fillRect(0,0,vw,vh);
  if(w==='rain'){ ctx.strokeStyle='rgba(205,222,255,.32)'; ctx.lineWidth=1.1; ctx.beginPath(); for(const p of wx){ ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-2.5,p.y+11+p.s*5); } ctx.stroke(); }
  else if(w==='snow'){ ctx.fillStyle='rgba(255,255,255,.85)'; for(const p of wx){ ctx.beginPath(); ctx.arc(p.x,p.y,1.1+p.s*1.9,0,7); ctx.fill(); } }
  else if(w==='leaves'){ const cols=['#c4622d','#d88a2c','#a8432a','#d9b13e']; for(const p of wx){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.scale(1,Math.abs(Math.cos(p.r*1.3))*0.8+0.2); ctx.fillStyle=cols[p.c]; ctx.beginPath(); ctx.ellipse(0,0,5,2.6,0,0,7); ctx.fill(); ctx.restore(); } }
}
function update(dt){
  time+=dt;
  if(state==='intro'){ introT-=dt; if(introT<=0) endIntro(); }
  else if(state==='flying') stepFlight(dt);
  else if(state==='rolling') stepRoll(dt);
  else if(state==='holed'){ holedT-=dt; if(ball.holed) ball.sink=Math.min(1,ball.sink+dt*3); if(holedT<=0) completeHole(); }
  else if(state==='penalty'){ penT-=dt; if(penT<=0){ const to=ball.dropTo||lastPos; ball.hidden=false; ball.x=to.x; ball.y=to.y; ball.dropTo=null; stopped(); } }
  fx.forEach(f=>f.t+=dt*1.2); fx=fx.filter(f=>f.t<1);
  const ai=state==='ready'?aimInfo():null, lieEl=$('#lie');
  if(ai){ const txt=CLUBS[clubIdx].putt?`Putt · ${Math.round(ai.p*100)}%`:`Power ${Math.round(ai.p*100)}%${ai.p>1?' · overswing':''}`;
    if(lieEl.textContent!==txt) lieEl.textContent=txt; lieEl.classList.toggle('hot',ai.p>1); lieAim=true; }
  else if(lieAim){ lieAim=false; lieEl.classList.remove('hot'); updateHud(); }
  if(hole){ updateSide(); updateSwing(dt); updateCamera(dt); }
  stepWeather(dt);
  if(sheetKind==='hub' && hubTab==='golfer') drawPreview();
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=(hole&&hole.surOuter)||pal().outside; ctx.fillRect(0,0,vw,vh);
  if(!hole) return;
  const z=cam.z, ox=vw/2-cam.x*z, oy=vh/2-cam.y*z;
  ctx.setTransform(dpr*z,0,0,dpr*z,dpr*ox,dpr*oy);
  const x0=Math.max(0,-ox/z), y0=Math.max(0,-oy/z), x1=Math.min(hole.w,(vw-ox)/z), y1=Math.min(hole.H,(vh-oy)/z);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  if(hole.sur){ const sx0=Math.max(-SMX,-ox/z), sy0=Math.max(-SMY,-oy/z), sx1=Math.min(hole.w+SMX,(vw-ox)/z), sy1=Math.min(hole.H+SMY,(vh-oy)/z);
    if(sx1>sx0 && sy1>sy0) ctx.drawImage(hole.sur, (sx0+SMX)*SS, (sy0+SMY)*SS, (sx1-sx0)*SS, (sy1-sy0)*SS, sx0, sy0, sx1-sx0, sy1-sy0); }
  if(x1>x0 && y1>y0) ctx.drawImage(vis, x0*VIS, y0*VIS, (x1-x0)*VIS, (y1-y0)*VIS, x0, y0, x1-x0, y1-y0);
  drawCup(z); drawFx(z);
  if(state!=='menu'){ drawBall(z); drawGolferWorld(z); }
  if(aim && state==='ready') drawAim(z);
  drawWeather();
}
function drawCup(z){
  const c=hole.cup, r=Math.max(CUP_R,4/z);
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(c.x,c.y,r+1.6/z,0,7); ctx.fill();
  ctx.fillStyle='#10180f'; ctx.beginPath(); ctx.arc(c.x,c.y,r,0,7); ctx.fill();
  const ph=Math.max(46,30/z), top=c.y-ph;
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=Math.max(2.2,1.5/z); ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x+ph*0.55,c.y+ph*0.25); ctx.stroke();
  ctx.strokeStyle='#f4f5ef'; ctx.lineWidth=Math.max(2.4,1.6/z); ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x,top); ctx.stroke();
  const s=Math.min(1,wind.mph/Math.max(1,EV.windMax)), wx=wind.mph?Math.cos(wind.a):1, wy=wind.mph?Math.sin(wind.a):0.6;
  const len=Math.max(26,18/z)*(0.75+0.25*s), flut=Math.sin(time*(6+s*8))*3*(0.4+s);
  ctx.fillStyle=COL.flag; ctx.beginPath(); ctx.moveTo(c.x,top); ctx.lineTo(c.x,top+len*0.5);
  ctx.lineTo(c.x+wx*len, top+len*0.25+wy*len*0.35+flut+(1-s)*len*0.3); ctx.closePath(); ctx.fill();
}
function drawFx(z){
  fx.forEach(f=>{ const a=1-f.t;
    if(f.type==='splash'){ ctx.strokeStyle=`rgba(230,245,255,${a})`; ctx.lineWidth=2.5/z; [0,0.25].forEach(o=>{ const t=f.t-o; if(t<0) return; ctx.beginPath(); ctx.ellipse(f.x,f.y,8+t*48,(8+t*48)*0.7,0,0,7); ctx.stroke(); }); }
    else { ctx.fillStyle=`rgba(232,214,160,${a*0.8})`; for(let k=0;k<8;k++){ const ang=k/8*Math.PI*2, d=6+f.t*26; ctx.beginPath(); ctx.arc(f.x+Math.cos(ang)*d,f.y+Math.sin(ang)*d*0.7-f.t*10,3.5*(1-f.t*0.5),0,7); ctx.fill(); } }
  });
}
function drawBall(z){
  if(!ball || ball.hidden) return;
  const col=colorDef();
  if(ball.trail.length>1){ ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2.2/z; ctx.lineCap='round'; ctx.beginPath(); ball.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.lineTo(ball.x,ball.y-ball.z); ctx.stroke(); }
  const sc=1-ball.sink; if(sc<=0.03) return;
  const r=Math.max(BALL_R,3.8/z)*sc;
  ctx.fillStyle=`rgba(0,0,0,${0.32-Math.min(0.2,ball.z/400)})`; ctx.beginPath(); ctx.ellipse(ball.x+1.5+ball.z*0.12,ball.y+1.8,r*(1+ball.z/160),r*0.75*(1+ball.z/160),0,0,7); ctx.fill();
  const by=ball.y-ball.z, br=r*(1+ball.z/90);
  const g=ctx.createRadialGradient(ball.x-br*.35,by-br*.35,br*.1,ball.x,by,br); g.addColorStop(0,col.c1); g.addColorStop(1,col.c2);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ball.x,by,br,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1/z; ctx.stroke();
}
const BAND=0.6; // pull-back band is drawn at 60% of the finger's drag so it fits on screen
function aimLabel(text,x,y,z){
  ctx.font=`700 ${16/z}px "Barlow Condensed","Arial Narrow",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.lineWidth=4/z; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.strokeText(text,x,y); ctx.fillStyle='#fff'; ctx.fillText(text,x,y);
}
function drawAim(z){
  const a=aimInfo(); if(!a) return;
  const e=eff(clubIdx), lie=terrainAt(ball.x,ball.y), lf=lieFactor(e,lie), p=a.p, pc=Math.min(p,1), over=p>1;
  const col = over ? `hsl(${3+9*Math.sin(time*16)},90%,56%)` : `hsl(${130-90*p},78%,52%)`;
  const bx=ball.x-a.dx*a.L*BAND/z, by=ball.y-a.dy*a.L*BAND/z;
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=8/z; ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(bx,by); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=5/z; ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(bx,by); ctx.stroke();
  if(!e.putt){ const tx=ball.x-a.dx*a.md*BAND/z, ty=ball.y-a.dy*a.md*BAND/z, nx=-a.dy, ny=a.dx, tl=8/z;
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=4/z; ctx.beginPath(); ctx.moveTo(tx-nx*tl,ty-ny*tl); ctx.lineTo(tx+nx*tl,ty+ny*tl); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2/z; ctx.beginPath(); ctx.moveTo(tx-nx*tl,ty-ny*tl); ctx.lineTo(tx+nx*tl,ty+ny*tl); ctx.stroke(); }
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(bx,by,7/z,0,7); ctx.fill();
  aimLabel(`${Math.round(p*100)}%${over?' OVERSWING':''}`, bx-a.dx*24/z, by-a.dy*24/z+8/z, z);
  ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.lineWidth=2.4/z;
  if(e.putt){
    const v=e.v*p*lf, roll=rollDist(v,fricOf(lie)), ex=ball.x+a.dx*roll*0.45, ey=ball.y+a.dy*roll*0.45, ft=roll*YPP*3;
    ctx.setLineDash([7/z,6/z]); ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(ex,ey); ctx.stroke(); ctx.setLineDash([]);
    aimLabel(`~${Math.max(5,Math.round(ft/5)*5)} ft`, ex, ey-10/z, z);
    return;
  }
  const hh=e.h*(0.5+0.5*pc);
  {
    const full=p*e.carry, n=10, frac=0.42;
    for(let i=1;i<=n;i++){ const u=frac*i/n, x=ball.x+a.dx*full*u, y=ball.y+a.dy*full*u-4*hh*u*(1-u)*0.9; ctx.fillStyle=`rgba(255,255,255,${(0.92*(1-i/(n+2))).toFixed(3)})`; ctx.beginPath(); ctx.arc(x,y,2.6/z,0,7); ctx.fill(); }
    const lx=ball.x+a.dx*full*frac, ly=ball.y+a.dy*full*frac-4*hh*frac*(1-frac)*0.9;
    aimLabel(`~${Math.round(full*YPP/10)*10} yds`, lx, ly-10/z, z);
  }
}

let last=performance.now();
function frame(ts){ const dt=Math.min(0.033,Math.max(0,(ts-last)/1000)); last=ts; update(dt); draw(); requestAnimationFrame(frame); }

/* ---------- Boot ---------- */
window.addEventListener('resize',()=>{ resize(); if(hole && state==='menu') snapCamera(); });
resize();
EV=currentEvent(); HOLES=EV.holes; field=[{name:'You',you:true}]; playerScores=[];
startHole(0);
if(save.carried) delete save.caddie;
if(save.caddie){ const refund=save.caddie>=2?115000:25000; save.cash+=refund; delete save.caddie; persist(); setTimeout(()=>toast(`Caddies are gone. ${money(refund)} refunded to your bank.`,3600),600); }
Sound.setSeason(season().id);
renderSound();
showHub();
if(save.carried){ delete save.carried; persist(); setTimeout(()=>toast('New career on the Amateur tour. Your golfer came with you.',3400),400); }
requestAnimationFrame(frame);
})();
</script>
